<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reel Brain</title>
  <meta name="description" content="Everything Claude learned from the reels and posts Atharva shared, sorted by the kind of work it serves.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0d0e10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ec6a35'/%3E%3Cpath d='M11 23V9h6a4.5 4.5 0 0 1 0 9h-6m6 0 4 5' fill='none' stroke='%230d0e10' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Unbounded:wght@500;600;700&family=Rozha+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <a class="skip" href="#main">Skip to the content</a>

  <header class="top">
    <div class="brand">
      <h1><span class="wordmark">Reel Brain</span> <span class="deva" lang="hi">ज्ञान भंडार</span></h1>
      <p class="sub">Everything Claude learned from the reels and posts you shared, sorted by the work it serves.</p>
    </div>
    <div class="top-tools">
      <span class="updated" id="updated" aria-live="polite"></span>
      <button class="icon-btn" id="theme" type="button" aria-label="Switch light or dark"></button>
    </div>
  </header>

  <section class="meters" id="meters" aria-label="Progress"></section>

  <main id="main" tabindex="-1">
    <div class="toolbar">
      <button class="back" id="back" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>All categories
      </button>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <span class="sr">Search</span>
        <input id="q" type="search" placeholder="Search everything: titles, apps, creators" autocomplete="off">
      </label>
      <div class="seg" role="radiogroup" aria-label="Filter by kind" id="kindSeg"></div>
    </div>
    <div id="view"></div>
  </main>

  <footer class="foot">
    <p>Built from the Notion Reel Inbox and refreshed every hour. Client names and private notes are never published.</p>
  </footer>

  <script src="app.js?v=2"></script>
</body>
</html>
